<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Career Quiz Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c16;--bg2:#161a33;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--tx:#e9ecf8;--mut:#98a0bd;--a:#5eead4;--b:#a78bfa;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{box-sizing:border-box;scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100%;background:radial-gradient(1000px 600px at 90% -10%,var(--bg2),var(--bg));background-color:var(--bg);color:var(--tx);font:400 17px/1.6 Figtree,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Bricolage Grotesque',Georgia,sans-serif;line-height:1.1;margin:0}
svg{display:block}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.22;z-index:0;pointer-events:none}
.o1{width:380px;height:380px;background:var(--b);left:-120px;top:10%}.o2{width:320px;height:320px;background:var(--a);right:-100px;bottom:5%}
nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:12px 5vw;background:rgba(10,12,22,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:800 20px 'Bricolage Grotesque',sans-serif;color:var(--tx);background:none;border:0;cursor:pointer;padding:0}
.brand span{color:var(--a);display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:none;border:0;color:var(--mut);cursor:pointer;font:500 16px Figtree;padding:8px 16px;border-radius:30px;transition:.2s}
.tab:hover{color:var(--tx)}.tab.on{color:#07241f;background:var(--a)}.tab.lock{opacity:.5}
.wrap{position:relative;z-index:1;max-width:1180px;margin:auto;padding:30px 5vw 70px}
.hero{text-align:center;padding:50px 0 30px}
.eyebrow{display:inline-block;font:600 13px Figtree;letter-spacing:.1em;text-transform:uppercase;color:var(--a);margin-bottom:14px}
.hero h1{font-size:clamp(36px,6vw,70px);font-weight:800;letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:60ch;margin:18px auto 28px;font-size:19px}
.btn{border:0;cursor:pointer;font:600 17px Figtree;padding:14px 30px;border-radius:40px;color:#07241f;background:linear-gradient(135deg,var(--a),#8ff5e5);box-shadow:0 7px 0 rgba(0,0,0,.4),0 14px 34px rgba(94,234,212,.18);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(3px);box-shadow:0 4px 0 rgba(0,0,0,.4)}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--line);box-shadow:none;margin-left:10px}
h2.sh{font-size:clamp(26px,3.6vw,40px);margin:60px 0 10px}.lead{color:var(--mut);max-width:62ch;margin:0 0 26px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;perspective:1100px}
.box{padding:24px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.box h3{font-size:21px;margin:14px 0 8px}.box p{margin:0;color:var(--mut);font-size:15.5px}
.ico{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;color:var(--a);background:rgba(94,234,212,.09);border:1px solid rgba(94,234,212,.25)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{padding:22px;border-radius:22px;border:1px solid var(--line);background:var(--card)}
.stat b{display:block;font:800 40px 'Bricolage Grotesque';color:var(--a)}.stat span{color:var(--mut);font-size:15px}
.grid{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;perspective:1200px}
.cat{flex:0 0 calc((100% - 60px)/4);min-width:210px;cursor:pointer;text-align:left;color:var(--tx);font:inherit;padding:22px 20px;border-radius:24px;background:var(--card);border:1px solid var(--line);transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s,box-shadow .25s,border-color .25s;position:relative}
.cat:hover,.cat:focus-visible{box-shadow:0 24px 44px rgba(0,0,0,.45);border-color:var(--a);outline:none}
.cat .ico{transform:translateZ(34px);margin-bottom:14px}.cat h3{font-size:19px;transform:translateZ(20px)}.cat small{display:block;color:var(--mut);margin-top:6px;font-size:14px}
.tag{position:absolute;right:14px;top:14px;font:600 13px Figtree;padding:3px 10px;border-radius:20px;background:var(--a);color:#07241f}
.panel{max-width:780px;margin:10px auto 0;padding:34px;border-radius:30px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 30px 60px rgba(0,0,0,.45);animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:perspective(900px) rotateY(22deg) translateX(30px)}to{opacity:1;transform:none}}
.panel h2{font-size:clamp(28px,4vw,40px);margin:14px 0 10px}.panel p{color:var(--mut);margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}.chips span{font-size:14px;padding:5px 13px;border-radius:20px;border:1px solid var(--line)}
.back{background:none;border:0;color:var(--mut);cursor:pointer;font:500 15px Figtree;padding:0;margin-bottom:16px}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0 22px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:9px;transition:width .4s}
.q{font-size:clamp(22px,3vw,30px);margin-bottom:22px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.scale button{cursor:pointer;color:var(--tx);font:500 14px Figtree;padding:16px 4px;border-radius:18px;background:var(--card);border:1px solid var(--line);transition:.2s}
.scale button b{display:block;font:800 24px 'Bricolage Grotesque';color:var(--a);margin-bottom:2px}
.scale button:hover,.scale button:focus-visible{transform:translateY(-6px) rotateX(10deg);border-color:var(--a);background:rgba(94,234,212,.1);outline:none}
.ring{width:180px;height:180px;border-radius:50%;margin:8px auto 18px;display:grid;place-items:center;background:conic-gradient(var(--a) calc(var(--p)*1%),var(--line) 0);box-shadow:0 20px 40px rgba(0,0,0,.5);transform:perspective(600px) rotateX(14deg)}
.ring div{width:142px;height:142px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:800 42px 'Bricolage Grotesque'}
.res{text-align:center}.res h3{text-align:left;font-size:22px;margin:22px 0 8px}.res ul{text-align:left;margin:0;padding-left:20px;color:var(--mut)}
.res .chips{justify-content:flex-start}
.job{text-align:left;margin-top:26px;padding:22px;border-radius:22px;border:1px solid rgba(94,234,212,.3);background:rgba(94,234,212,.05)}
.job h3{margin:0 0 6px}.job .lv{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--a);margin-bottom:8px}
.dots{display:flex;gap:5px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--a)}
.job p{color:var(--tx);margin:0 0 10px}.job li{margin-bottom:6px;color:var(--mut)}
.job a,.src a{color:var(--a);text-decoration:underline;text-underline-offset:3px}
.src{font-size:14px;color:var(--mut);margin:12px 0 0}
.fine{font-size:13.5px;color:var(--mut);margin-top:14px}
.row{margin-top:24px}
label{display:block;text-align:left;font-weight:500;margin:14px 0 6px;font-size:15px}
input,select,textarea{width:100%;font:500 16px Figtree;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--tx)}
select option{background:#161a33}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a)}
.err{color:#ff9aa8;font-size:14px;min-height:20px;margin-top:8px;text-align:left}
.stars{display:flex;gap:6px;margin:6px 0}.stars button{background:none;border:0;font-size:30px;color:var(--line);cursor:pointer;padding:0;line-height:1}.stars button.on{color:var(--a)}
.rv{padding:18px 20px;border-radius:20px;border:1px solid var(--line);background:var(--card);margin-top:14px}.rv b{color:var(--a)}.rv p{margin:6px 0 0;color:var(--tx)}
footer{text-align:center;color:var(--mut);font-size:14px;margin-top:50px}
@media(max-width:900px){.cat{flex-basis:calc((100% - 20px)/2)}.cols,.stats{grid-template-columns:1fr}}
@media(max-width:520px){.cat{flex-basis:100%}.scale{grid-template-columns:1fr 1fr}.panel{padding:22px}.btn.g{margin:12px 0 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tab.si{border:1px solid var(--a);color:var(--a)}.tab.si.on{color:#07241f}
.stage{perspective:1100px;height:300px;display:grid;place-items:center;margin-bottom:10px}
.ring3d{position:relative;width:96px;height:120px;transform-style:preserve-3d;transform:rotateX(-10deg);animation:spin 24s linear infinite}
.stage:hover .ring3d{animation-play-state:paused}
.ring3d i{position:absolute;inset:0;display:grid;place-items:center;color:var(--a);border-radius:20px;border:1px solid rgba(94,234,212,.35);background:linear-gradient(160deg,rgba(94,234,212,.16),rgba(167,139,250,.06));backdrop-filter:blur(4px);box-shadow:0 0 40px rgba(94,234,212,.15);transform:rotateY(calc(var(--i)*45deg)) translateZ(190px)}
@keyframes spin{to{transform:rotateX(-10deg) rotateY(360deg)}}
.cat{animation:pop .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d)*70ms)}
@keyframes pop{from{opacity:0;transform:perspective(800px) rotateX(-55deg) translateY(40px)}to{opacity:1}}
.box,.stat{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s,border-color .25s}.box:hover,.stat:hover{border-color:var(--a)}
.ico{animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
@media(max-width:520px){.stage{transform:scale(.7);height:240px}}
.rfg{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.lk{margin:8px 0 0;padding-left:18px}.lk li{margin-bottom:6px;color:var(--mut);font-size:15px}.lk a{color:var(--a);text-decoration:underline;text-underline-offset:3px}@media(max-width:700px){.rfg{grid-template-columns:1fr}}
</style>
</head>

var J=[
{o:5,l:"Very strong",s:"Pakistan’s tech exports are growing fast and the government wants to more than double them by FY2029, so demand for developers, data and AI skills should keep rising.",f:["IT exports hit a record $4.6bn in FY26, up about 21% from $3.81bn (SBP data).","Freelance exports rose 51% to $856m in July–March FY26.","Government target: $10bn of IT exports by FY29."],k:[["Profit: IT exports FY26","https://profit.pakistantoday.com.pk/2026/07/18/pakistans-it-exports-hit-record-dollar46-billion-in-fy26-surpass-government-target"],["APP: ICT exports and freelancers","https://www.app.com.pk/business/pakistans-ict-exports-rise-19-7-per-cent-to-record-3-38bn/"]]},
{o:5,l:"Very strong (shortage of staff)",s:"Pakistan has far fewer doctors and especially nurses than health standards recommend, so health workers should stay in demand. Pay and training quality are the main problems.",f:["A Senate committee heard of a shortage of over one million nurses, with about 0.5 nurses per doctor.","WHO’s benchmark is 4.45 doctors, nurses and midwives per 1,000 people; Pakistan is at about 1.45.","Many health workers leave for jobs abroad."],k:[["Gulf News: nurse shortage","https://gulfnews.com/world/asia/pakistan/nurses-on-the-run-pakistans-healthcare-system-bleeds-talent-1.500222134"],["Business Recorder: health workforce","https://www.brecorder.com/news/amp/4601647"],["CAREC: nurse shortage","https://health.carecprogram.org/2026/04/29/a-comprehensive-approach-to-a-critical-issue-the-nurse-shortage/"]]},
{o:2,l:"Mixed: many graduates, fewer jobs",s:"Pakistan trains many engineers but its industry absorbs fewer of them. Solar and energy projects are a growing exception, so specialise and build practical skills.",f:["A PEC governing-body member said over 150,000 engineers are unemployed (2024).","Manufacturing is only around 13% of GDP, which limits demand for engineers.","Solar and energy projects are creating new technical work."],k:[["ProPakistani: unemployed engineers","https://propakistani.pk/2024/08/12/more-than-150000-engineers-are-unemployed-in-pakistan/"],["Engineering Review: demand vs graduates","https://engineeringreview.com.pk/training-50000-engineers-without-industrial-growth-promise-or-policy-mismatch/"]]},
{o:4,l:"Growing",s:"Banking is going digital, which creates roles in fintech, risk and Islamic finance. AI is also changing which skills banks look for.",f:["Digital banking users passed 127 million by March 2026.","KPMG says AI, Islamic banking conversion and digital banks are reshaping workforce needs."],k:[["Arab News: digital banking users","https://www.arabnews.pk/node/2635109"],["KPMG: Pakistan Banking Perspective 2026","https://assets.kpmg.com/content/dam/kpmgsites/pk/pdf/2026/04/Pakistan-Banking-Perspective-2026.pdf.coredownload.inline.pdf"]]},
{o:4,l:"Growing (freelance and online work)",s:"Design, video and content can be sold online, and freelance exports are rising fast. Income depends heavily on the quality of your portfolio.",f:["Freelance exports grew 51% to $856.3m in July–March FY26.","34,420 IT and IT-enabled companies were registered with SECP by March 2026."],k:[["APP: ICT exports and freelancers","https://www.app.com.pk/business/pakistans-ict-exports-rise-19-7-per-cent-to-record-3-38bn/"],["Tribune: freelancers drive IT exports","https://tribune.com.pk/story/2613736/it-exports-hit-record-at-418b"]]},
{o:3,l:"Big need, limited funding",s:"Pakistan needs many more teachers, but public hiring depends on government budgets. Private schools, subject specialists and online teaching are growing areas.",f:["About 25–26 million children are out of school.","Over 115,000 more teachers are needed in primary schools that enrol girls, to reach one teacher per 30 children."],k:[["Arab News: the teacher gap","https://www.arabnews.pk/node/2625826"],["Gulf News: out-of-school children","https://gulfnews.com/world/asia/pakistan/25-million-pakistani-children-still-out-of-school-report-1.500598426"]]},
{o:3,l:"Mixed",s:"Courts have large case backlogs and many judge vacancies, so judicial and civil-service roles exist. Private practice is crowded and slow to build.",f:["About 2.26 million cases were pending nationwide in late 2023, 82% in district courts.","Lahore High Court had 41 judges against 60 sanctioned posts (May 2026)."],k:[["The News: Justice delayed","https://www.thenews.pk/tns/detail/1336105-justice-delayed"],["Dawn: LHC judge vacancies","https://www.dawn.com/news/1997014"]]},
{o:2,l:"Limited local openings",s:"Research jobs in Pakistan are few because R&D spending is very low. Many researchers work in universities or move abroad.",f:["R&D spending was 0.16% of GDP in 2023 (World Bank data).","India spends about 0.8% and China about 2.65% (The News)."],k:[["Trading Economics: World Bank data","https://tradingeconomics.com/pakistan/research-and-development-expenditure-percent-of-gdp-wb-data.html"],["The News: Innovation nation","https://www.thenews.pk/print/1272252-innovation-nation"]]},
{o:3,l:"Large but changing",s:"Agriculture is still the biggest employer, but its share is falling as work moves to services. Food processing, farm technology and agri-business are the growth areas.",f:["Agriculture employed 33.1% of workers in 2024-25, down from 37.4% in 2020-21.","Unemployment reached 7.1% in 2024-25, a 21-year high."],k:[["Dawn: Labour Force Survey","https://www.dawn.com/news/1957383"],["Tribune: unemployment at 21-year high","https://tribune.com.pk/story/2579171/1"]]},
{o:2,l:"Challenging in traditional media",s:"TV and newspaper jobs are shrinking because of layoffs and weak advertising. Digital video, social media and content roles need new skills.",f:["Dawn News reportedly cut about 60 jobs in August 2026, after DawnNews.tv closed in 2025.","Some TV journalists report salary delays of up to three months."],k:[["JournalismPakistan: Dawn News cuts","https://www.journalismpakistan.com/dawn-news-job-cuts-deepen-media-employment-crisis"],["JournalismPakistan: Abb Takk layoffs","https://www.journalismpakistan.com/abb-takk-layoffs-deepen-pakistan-media-job-crisis"]]},
{o:2,l:"Limited data, modest pay",s:"There is little official data. Current openings are mostly school PE teachers, gym trainers and coaches, and pay is modest. Based on job ads, not statistics.",f:["A fitness trainer ad in Lahore offered PKR 30,000–40,000 a month.","A PE instructor ad offered up to PKR 45,000 a month."],k:[["Mustakbil: sports jobs in Lahore","https://www.mustakbil.com/jobs/pakistan/lahore/sports-and-recreation"],["Qureos: PE instructor job","https://app.qureos.com/jobs/physical-education-instructor-pti-1770490060521"]]},
{o:4,l:"Growing",s:"Tourism already supports millions of jobs, mostly through domestic travel. Hotels, travel planning and events can grow further as visitor numbers rise.",f:["Tourism supported about 4.73 million jobs and 5.8% of GDP in 2023 (WTTC).","Tourism jobs grew 6.7% in a single year."],k:[["The News: Lost potential (WTTC data)","https://www.thenews.pk/magazine/money-matters/1433759-lost-potential"]]},
{o:4,l:"Strong in clean energy",s:"The solar boom is creating installation, maintenance and manufacturing work. Climate and conservation roles are smaller but growing.",f:["The solar rush created an estimated 500,000 direct and indirect jobs by FY25.","A World Bank study sees up to 190,000 direct and 137,000 indirect renewable jobs by 2030."],k:[["Renewables First: Solar rush dividends","https://renewablesfirst.org/resources/publications/the-many-dividends-of-solar-rush-in-pakistan"],["Dawn: World Bank renewable jobs study","https://www.dawn.com/news/1697915"]]},
{o:3,l:"Mixed",s:"Pakistan lacks experienced pilots and plans to train and export them. Even so, some new licence holders struggle to find jobs, and local airlines are financially fragile.",f:["Annual air passengers grew from 12.8 million (2006-07) to 24.3 million (2024-25).","The CAA plans to train and export pilots to foreign airlines."],k:[["Dawn: Shortage of pilots","https://www.dawn.com/news/2002205"],["ProPakistani: CCP aviation report","https://propakistani.pk/2026/03/09/ccp-calls-for-national-level-aviation-plan-to-boost-pakistans-aviation-sector/"]]},
{o:2,l:"Uncertain, competitive",s:"US aid cuts in 2025 cost many NGO jobs. Groups are adapting with diaspora and government funding, but entry-level roles are competitive.",f:["The US froze 39 projects worth over $845m in Pakistan.","Some local NGOs lost up to 60% of their income."],k:[["Geo News: $845m projects suspended","https://www.geo.tv/latest/588965-us-suspends-845m-aid-projects-in-pakistan-amid-policy-shift"],["Start Network: A year after USAID","https://startnetwork.org/learn-change/news-and-blogs/year-after-usaid-perspective-pakistan"]]}
];

J=J.concat([{"o": 4, "l": "Growing", "s": "As more services move online, cybersecurity is getting more attention in Pakistan, so trained security staff should be needed in banks, telecom and government. This is our reading of the sources, which cover IT in general.", "f": ["The government pledged to strengthen cybersecurity as it pushes IT exports (FY26).", "Pakistan had 34,420 registered IT and IT-enabled companies in March 2026, and each must protect its data."], "k": [["Nukta: IT exports FY26", "https://nukta.com/pakistan-highest-it-exports-fy26"], ["APP: ICT exports", "https://www.app.com.pk/business/pakistans-ict-exports-rise-19-7-per-cent-to-record-3-38bn/"]]}, {"o": 4, "l": "Growing", "s": "Data and AI skills are in demand as IT exports rise and the government pushes digital and AI plans.", "f": ["Pakistan launched an AI Policy 2025 and the Digital Nation Pakistan framework.", "IT exports hit a record $4.6bn in FY26."], "k": [["APP: ICT exports and AI policy", "https://www.app.com.pk/business/pakistans-ict-exports-rise-19-7-per-cent-to-record-3-38bn/"], ["Profit: IT exports FY26", "https://profit.pakistantoday.com.pk/2026/07/18/pakistans-it-exports-hit-record-dollar46-billion-in-fy26-surpass-government-target"]]}, {"o": 5, "l": "Very strong (shortage of staff)", "s": "Pakistan has far too few nurses and midwives, so jobs are plentiful at home and abroad. Pay and working conditions are the main concerns.", "f": ["The country has an estimated shortage of about 1 million nurses.", "There are about 0.61 nurses per doctor, while WHO suggests 2 to 4.", "Thousands of nurses leave for better pay overseas."], "k": [["CAREC: nurse shortage", "https://health.carecprogram.org/2026/04/29/a-comprehensive-approach-to-a-critical-issue-the-nurse-shortage/"], ["Gulf News: nurses leaving", "https://gulfnews.com/world/asia/pakistan/nurses-on-the-run-pakistans-healthcare-system-bleeds-talent-1.500222134"]]}, {"o": 4, "l": "Strong", "s": "Livestock is the most dynamic part of Pakistan’s agriculture and supports millions of rural households, so vets, dairy and poultry experts are needed.", "f": ["Livestock contributed 14.97% of GDP and 63.6% of agriculture’s value added.", "It grew 4.72% in FY25 and engages over 8 million rural households."], "k": [["Dawn: Economic Survey, livestock", "https://www.dawn.com/news/1916126"], ["APP: livestock backbone of agriculture", "https://www.app.com.pk/?p=1078452"]]}, {"o": 4, "l": "Growing", "s": "Digital payments and digital banks are expanding quickly, creating roles in product, risk and customer support.", "f": ["Digital banking users passed 127 million by March 2026.", "The government aimed for 120 million banking-app users by June 2026.", "Digital banks’ assets reached nearly Rs 7 billion."], "k": [["Arab News: digital banking users", "https://www.arabnews.pk/node/2635109"], ["ProPakistani: digital bank assets", "https://propakistani.pk/2026/03/13/digital-banks-assets-in-pakistan-surge-to-nearly-rs-7-billion/"], ["TechJuice: 2026 goals", "https://www.techjuice.pk/?p=197605"]]}, {"o": 3, "l": "Big employer, under pressure", "s": "Textiles are Pakistan’s largest manufacturing industry and export earner, but high costs and weaker exports are slowing job growth. Design, merchandising and technical roles may fare better than basic factory work.", "f": ["Textile exports were about $17.9bn in FY25.", "The sector grew only 0.7% in July–March FY26.", "The Pakistan Textile Council asked for an ‘export emergency’ in January 2026 over falling competitiveness.", "A Chinese firm plans a textile hub with 25,000+ jobs (a plan, not yet delivered)."], "k": [["INP: textile growth FY26", "https://inp.net.pk/article-detail/inp-wealthpk/textile-sector-returns-to-growth-in-fy2025-26"], ["TIP: industry overview", "https://tip.edu.pk/?p=10970"], ["Radio Pakistan: textile hub plan", "https://radio.gov.pk/01-10-2026/chinese-company-plans-to-establish-modern-textile-export-hub-in-country"]]}, {"o": 3, "l": "Large but up and down 681"]]}, {"o": 4, "l": "Big gap, growing need", "s": "Pakistan has very few mental health professionals compared with the need, and a new national policy has been launched. Public-sector pay and funding remain limited.", "f": ["About 32.3% of adults live with at least one mental disorder (2019–22 survey).", "Estimates: 300–340 psychiatrists and about 478 psychologists nationwide.", "A National Mental Health Policy (2026–2035) has been launched."], "k": [["Express Tribune: mental health toll", "https://tribune.com.pk/story/2621767/economic-woes-take-toll-on-mental-health"], ["The News: Beyond the clinic", "https://www.thenews.pk/tns/detail/1441955-beyond-the-clinic"]]}, {"o": 4, "l": "Growing", "s": "Pharma exports and domestic production are rising, which means roles in manufacturing, quality control and sales. Drug registration delays and costs are obstacles.", "f": ["Pharma exports grew 34% to $457m in FY25, the fastest in two decades.", "The industry wants to reach $2bn in annual exports."], "k": [["Profit: pharma exports FY25", "https://profit.pakistantoday.com.pk/2025/07/23/pakistans-pharmaceutical-exports-hit-34-growth-in-fy25-marking-a-two-decade-high"], ["Profit: $2bn export goal", "https://profit.pakistantoday.com.pk/2026/06/17/pharmaceutical-industry-seeks-fiscal-and-regulatory-incentives-to-raise-exports-to-dollar2-billion"]]}, {"o": 3, "l": "Promising but uncertain", "s": "Pakistan has large mineral reserves, but projects depend on investment and security. Treat big job promises as plans, not guarantees.", "f": ["Minerals contribute about 3.2% of GDP and employ roughly 300,000 people.", "Reko Diq is expected to employ about 7,500 at peak construction and 4,000 long-term.", "In September 2026 Barrick reportedly slowed the project, citing security in Balochistan."], "k": [["Profit: mining sector figures", "https://profit.pakistantoday.com.pk/?p=219467"], ["Gulf News: Reko Diq jobs", "https://gulfnews.com/world/asia/pakistan/pakistans-reko-diq-unlocking-billions-in-copper-and-gold-reserves-1.500243422"], ["Daily Pakistan: project slowed", "https://en.dailypakistan.com.pk/30-Sep-2026/mining-giant-barrick-slows-9-billion-reko-diq-project-citing-balochistan-security-situation"]]}, {"o": 3, "l": "Steady but very competitive", "s": "Community and public services employ many people and government posts stay popular, but they are filled through competitive exams and depend on budgets.", "f": ["Community and social services made up 19.5% of employment in 2024-25.", "Unemployment was 7.1% in 2024-25, so competition for secure jobs is high."], "k": [["PBS: Labour Force Survey insights", "https://pbs.gov.pk/wp-content/uploads/2020/07/Key-Insights-of-Labour-Force-Survey.pdf"], ["Dawn: unemployment at 21-year high", "https://www.dawn.com/news/1957383"]]}, {"o": 3, "l": "Tied to the building cycle", "s": "Design work follows construction. There is demand in housing and commercial projects, but many firms are small and the field is competitive.", "f": ["Construction contributes about 2.5% of GDP and employs about 8% of workers.", "Private-sector construction has been described as weak."], "k": [["Dawn: construction skills", "https://www.dawn.com/news/amp/1861645"], ["Engineering Review", "https://engineeringreview.com.pk/?p=10168"]]}, {"o": 4, "l": "Growing (limited specific data)", "s": "Broadband and digital plans need network engineers and technicians. We found little sector-specific job data, so this is a general reading of IT-sector sources.", "f": ["The government plans to expand broadband, cybersecurity and digital infrastructure.", "ICT exports reached a record $4.6bn in FY26."], "k": [["Nukta: IT exports FY26", "https://nukta.com/pakistan-highest-it-exports-fy26"], ["APP: ICT exports", "https://www.app.com.pk/business/pakistans-ict-exports-rise-19-7-per-cent-to-record-3-38bn/"]]}]);
